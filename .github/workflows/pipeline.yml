name: Production Pipeline (CI + CD)

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # ==========================================
    # JOB 1: Continuous Integration (Cek Kode)
    # ==========================================
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install HTMLHint
              run: npm install -g htmlhint

            - name: Validasi HTML
              run: htmlhint index.html

    # ==========================================
    # JOB 2: Continuous Deployment (Publish Web)
    # ==========================================
    deploy:
        # KUNCI UTAMA: Job ini MENUNGGU job 'lint' sukses dulu!
        needs: lint

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "."

            - name: Deploy ke GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
