name: Production Pipeline (CI + CD)

on:
    push:
        branches:
            - main
    # 1. TAMBAHKAN TRIGGER PULL REQUEST:
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # ==========================================
    # JOB 1: LINT (Jalan di Push MAUPUN Pull Request)
    # ==========================================
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install HTMLHint
              run: npm install -g htmlhint

            - name: Validasi HTML
              run: htmlhint index.html

    # ==========================================
    # JOB 2: DEPLOY (HANYA jalan kalau event-nya PUSH ke main)
    # ==========================================
    deploy:
        needs: lint
        # 2. TAMBAHKAN KONDISI INI:
        # "Hanya jalankan deploy jika ini adalah PUSH ke branch main, JANGAN jalankan kalau cuma PR"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "."

            - name: Deploy ke GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
