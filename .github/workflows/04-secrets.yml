name: Belajar Environment dan Secrets

on:
    workflow_dispatch: # Kita buat manual trigger saja agar bisa dijalankan via tombol

# Environment Variable Biasa (Level Global)
env:
    NAMA_APLIKASI: "Aplikasi Belajar CI-CD"
    VERSI: "1.0.0"

jobs:
    cek-rahasia:
        runs-on: ubuntu-latest
        steps:
            # Step 1: Membaca Environment Variable Biasa
            - name: Baca Variabel Publik
              run: |
                  echo "Nama App: $NAMA_APLIKASI"
                  echo "Versi: $VERSI"

            # Step 2: Membaca Secret dari Brankas GitHub
            - name: Gunakan Secret dengan Aman
              # Cara terbaik: Masukkan secret ke dalam env lokal milik step ini
              env:
                  KUNCI_SAYA: ${{ secrets.API_KEY_RAHASIA }}
              run: |
                  echo "Mencoba mencetak secret ke layar:"
                  echo "Nilai kuncinya adalah: $KUNCI_SAYA"

            # Step 3: Pembuktian bahwa script tetap bisa memakai nilainya
            - name: Logika Script Menggunakan Secret
              env:
                  KUNCI_SAYA: ${{ secrets.API_KEY_RAHASIA }}
              run: |
                  if [ "$KUNCI_SAYA" == "rahasia-dapur-super-aman-12345" ]; then
                    echo " Otentikasi BERHASIL! Kunci rahasia cocok."
                  else
                    echo " Otentikasi GAGAL!"
                  fi
