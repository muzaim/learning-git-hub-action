name: CI - HTML Validator

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    lint-html:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install HTMLHint
              run: npm install -g htmlhint

            - name: Periksa Syntax HTML
              run: htmlhint index.html
