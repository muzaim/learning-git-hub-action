version: "3.8"

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_enterprise
    ports:
      - "8080:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_ENV=production-docker
      - NEXT_PUBLIC_APP_NAME=Enterprise Portal (Docker Production)
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
