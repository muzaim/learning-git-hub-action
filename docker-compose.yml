version: "3.8"

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_enterprise
    ports:
      - "8080:3000" # Port 8080 di Mac kamu -> mengarah ke port 3000 Next.js di dalam Docker
    restart: always
    environment:
      - NODE_ENV=production
